  kw:
  - outcome
  - measure
  - metric
  - dependent variable
  - effect
  q: Todos os desfechos para os quais se buscaram dados estão listados, definidos e ligados às questões de pesquisa?
  full: Desfechos listados e definidos, com relação às questões de pesquisa.
  partial: Desfechos citados sem definição ou sem relação com as questões.
  item: '10'
- code: 10b
  title: Demais variáveis e classificação
  applies: OOO

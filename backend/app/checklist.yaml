# Checklist SEGRESS (Kitchenham, Madeyski e Budgen, IEEE TSE 49(3), 2023, Tabela 9).
# 
# recommend: o que relatar quando o item não é atendido (a partir da Tabela 9). ref: seção do Material Suplementar do SEGRESS.
items:
- id: opening
  title: Abertura (Opening)
  section: introducao
  critical: false
  recommend: Abra a Introdução com o problema maior e sua importância, defina a área de pesquisa, estabeleça o nicho (a lacuna de conhecimento)
    e então foque nele.
  ref: ''
- id: '1'
  title: Título
  section: titulo_resumo
  critical: false
  recommend: Inclua no título o tipo de estudo (revisão sistemática, mapeamento sistemático, estudo terciário, revisão qualitativa ou de métodos
    mistos) e o tema revisado.
  ref: '2.1'
- id: '2'
  title: Resumo estruturado
  section: titulo_resumo
  critical: false
  recommend: Estruture o resumo em Contexto (com a importância da pesquisa), Objetivo, Métodos, Resultados, Limitações (opcional) e Conclusão.
  ref: '2.2'
- id: '3'
  title: Justificativa (rationale)
  section: introducao
  critical: false
  recommend: Explique por que a revisão é necessária (atualização, tema novo, novos resultados empíricos ou tema maduro sem revisão anterior)
    e como ela contribui para o problema maior.
  ref: '2.3'
- id: '4'
  title: Objetivos e questões de pesquisa
  section: introducao
  critical: false
  recommend: Liste as questões de pesquisa e explique como cada uma contribui para o problema maior.
  ref: '2.4'
- id: '5'
  title: Critérios de elegibilidade
  section: metodos
  critical: true
  recommend: Especifique os critérios de inclusão e exclusão a partir das características dos estudos e justifique as restrições da busca (datas
    de início e fim, idioma, periódicos, tipo de publicação). Diga como as revisões existentes encontradas na busca serão usadas.
  ref: '3.1'
- id: '6'
  title: Fontes de informação
  section: metodos
  critical: true
  recommend: Liste todas as fontes consultadas (bases, referências de estudos primários, pesquisadores contatados) com a data final da busca em
    cada uma. Use o checklist baseado no PRISMA-S do Material Suplementar.
  ref: '3.4'
- id: '7'
  title: Estratégia de busca
  section: metodos
  critical: true
  recommend: 'Apresente a estratégia completa: a string de busca de cada base, snowballing, busca manual, busca de literatura não publicada e
    como a completude foi avaliada. Se houver revisões anteriores, diga como contribuíram para a busca.'
  ref: '3.5'
- id: '8'
  title: Processo de seleção
  section: metodos
  critical: true
  recommend: Descreva as fases da seleção, quantos avaliadores analisaram cada estudo, como as discordâncias foram resolvidas, as ferramentas
    usadas e a concordância medida (por exemplo, kappa).
  ref: '3.6'
- id: '9'
  title: Processo de coleta de dados
  section: metodos
  critical: false
  recommend: Diga quantos revisores extraíram os dados de cada estudo, se trabalharam de forma independente, como os dados foram conferidos ou
    confirmados com os autores e quais ferramentas foram usadas.
  ref: '3.7'
- id: '10'
  title: Itens de dados (10a, 10b)
  section: metodos
  critical: false
  recommend: Liste e defina os desfechos buscados e sua relação com as questões de pesquisa (10a, exceto em mapeamentos) e as demais variáveis
    extraídas, incluindo o esquema de classificação e as suposições sobre dados ausentes (10b).
  ref: 3.8 e 3.9
- id: '11'
  title: Avaliação de risco de viés dos estudos
  section: metodos
  critical: true
  recommend: 'Descreva como o risco de viés (qualidade) dos estudos foi avaliado: instrumento ou critérios, quantos avaliadores por estudo e se
    trabalharam de forma independente.'
  ref: '3.10'
- id: '12'
  title: Medidas de efeito
  section: metodos
  critical: false
  recommend: Para cada desfecho, especifique a medida de efeito usada na síntese (por exemplo, diferença de médias padronizada ou razão de risco).
  ref: '3.11'
- id: '13'
  title: Métodos de análise e síntese (13a a 13f)
  section: metodos
  critical: true
  recommend: Descreva como os estudos foram agrupados em cada síntese (13a), a preparação dos dados ou a codificação (13b), as tabelas e gráficos
    (13c), o método de síntese com justificativa (13d), a análise de sensibilidade (13e) e a exploração da heterogeneidade (13f), conforme o tipo
    de estudo.
  ref: 3.12 a 3.18
- id: '14'
  title: Avaliação de viés de relato (publicação)
  section: metodos
  critical: false
  recommend: Descreva como foi avaliado o risco de viés por resultados ausentes (viés de publicação), por exemplo pelo rigor da busca ou, em meta-análises,
    por funnel plot.
  ref: '3.19'
- id: '15'
  title: Avaliação de certeza da evidência
  section: metodos
  critical: true
  recommend: Descreva o método usado para avaliar a certeza (confiança) no corpo de evidência de cada desfecho, como GRADE ou GRADE-CERQual.
  ref: '3.20'
- id: '16'
  title: Seleção de estudos (16a, 16b)
  section: resultados
  critical: true
  recommend: Relate o número de registros em cada etapa, da busca à inclusão, de preferência com diagrama de fluxo e estatísticas de concordância
    (16a). Cite os estudos quase incluídos e o motivo da exclusão (16b).
  ref: 4.1 e 4.2
- id: '17'
  title: Características dos estudos
  section: resultados
  critical: false
  recommend: Cite cada estudo incluído e apresente suas características, de preferência em tabela.
  ref: '4.3'
- id: '18'
  title: Risco de viés nos estudos
  section: resultados
  critical: false
  recommend: Apresente a avaliação de risco de viés (qualidade) de cada estudo incluído e a concordância entre os avaliadores.
  ref: '4.4'
- id: '19'
  title: Resultados dos estudos individuais
  section: resultados
  critical: false
  recommend: Para cada estudo, apresente as estatísticas por grupo e a estimativa de efeito com sua precisão (em revisões qualitativas, os principais
    achados), de preferência em tabelas ou gráficos.
  ref: '4.5'
- id: '20'
  title: Resultados das análises e sínteses (20a a 20d)
  section: resultados
  critical: false
  recommend: Para cada síntese ou questão de pesquisa, resuma as características e o risco de viés dos estudos que contribuem (20a) e apresente
    as estimativas com intervalo e heterogeneidade (20b), a sensibilidade ou os casos desviantes (20c) e as causas de heterogeneidade (20d), conforme
    o tipo de estudo.
  ref: 4.6 a 4.10
- id: '21'
  title: Vieses de relato (resultados)
  section: resultados
  critical: false
  recommend: Apresente a avaliação de viés de publicação de cada síntese; em meta-análises, a heterogeneidade entre estudos e o funnel plot.
  ref: '4.11'
- id: '22'
  title: Certeza da evidência (resultados)
  section: resultados
  critical: true
  recommend: Para cada achado, apresente a certeza (confiança) da evidência, por exemplo numa tabela de resumo de achados com o nível GRADE ou
    CERQual.
  ref: '4.12'
- id: '23'
  title: Discussão (23a a 23d)
  section: discussao
  critical: true
  recommend: Interprete os resultados frente a outras revisões (23a) e discuta as limitações da evidência (23b), as limitações do processo ainda
    não tratadas nos Métodos (23c) e as implicações para prática, política e pesquisa futura (23d).
  ref: 5.2 a 5.5
- id: '24'
  title: Registro e protocolo (24a a 24c)
  section: outras
  critical: false
  recommend: Informe o registro da revisão com nome e número, ou que ela não foi registrada (24a), onde o protocolo pode ser acessado (24b) e
    as alterações feitas em relação a ele, com justificativa (24c).
  ref: 6.2 a 6.4
- id: '25'
  title: Apoio e financiamento
  section: outras
  critical: false
  recommend: Declare as fontes de apoio financeiro e não financeiro e o papel dos financiadores, ou que não houve financiamento.
  ref: '6.5'
- id: '26'
  title: Conflitos de interesse
  section: outras
  critical: false
  recommend: Declare os conflitos de interesse dos autores ou a ausência deles.
  ref: '6.6'
- id: '27'
  title: Disponibilidade de dados, código e materiais
  section: outras
  critical: false
  recommend: Disponibilize em repositório público (Zenodo, Figshare, OSF) os formulários de extração, os dados extraídos, os dados das análises
    e o código, e diga onde estão.
  ref: '6.7'
checks:
- code: opening
  title: 'Abertura: contexto, nicho e lacuna'
  method: L
  applies: OOO
  sec:
  - introduction
  kw:
  - problem
  - important
  - challenge
  - however
  - gap
  - little is known
  - context
  q: A introdução apresenta o problema maior, dá contexto amplo, mostra a importância do trabalho, define a área de pesquisa, estabelece um nicho
    (lacuna de conhecimento) e então foca nesse nicho?
  full: Apresenta o problema e sua importância, define a área e explicita a lacuna (nicho) que a revisão ocupa.
  partial: Contextualiza o tema, mas não explicita a lacuna ou a importância do trabalho.
  absent: A introdução não contextualiza o problema nem a lacuna.
  item: opening
- code: '1'
  title: Título identifica o tipo de estudo
  applies: OOO
  method: R
  rule: title_type
  sec:
  - title
  q: O título identifica o relatório como revisão sistemática, mapeamento sistemático, estudo terciário, revisão qualitativa ou mista?
  full: Identifica explicitamente o tipo de estudo secundário.
  partial: Diz apenas revisão, survey ou levantamento, sem indicar que é sistemática.
  item: '1'
- code: '2'
  title: Resumo estruturado
  applies: OOO
  method: RL
  rule: abstract_structured
  sec:
  - abstract
  kw: []
  q: O resumo é estruturado e cobre contexto, objetivo, métodos, resultados e conclusão?
  full: Cobre contexto, objetivo, métodos, resultados e conclusão.
  partial: Cobre 2 ou 3 dessas partes, ou é um parágrafo corrido que menciona só algumas.
  item: '2'
- code: '3'
  title: Justificativa (rationale)
  applies: OOO
  method: L
  sec:
  - introduction
  kw:
  - gap
  - motivation
  - rationale
  - existing reviews
  - previous reviews
  - no systematic review
  - update
  - lack of
  q: A introdução justifica a revisão no contexto do conhecimento existente (lacuna, revisões anteriores, necessidade de atualizar ou de nova
    revisão)?
  full: Explica a lacuna ou o motivo da revisão em relação ao que já existe.
  partial: Descreve o tema e a importância, mas não a lacuna nem as revisões anteriores.
  item: '3'
- code: '4'
  title: Objetivos e questões de pesquisa
  applies: OOO
  method: RL
  rule: research_questions
  sec:
  - introduction
  - methods
  kw:
  - research question
  - RQ1
  - objective
  - aim of this
  q: Os objetivos ou questões de pesquisa estão explícitos e explicam como contribuem para o problema maior?
  full: Questões de pesquisa ou objetivos explícitos e ligados ao problema.
  partial: Há objetivo genérico, sem questões explícitas, ou questões sem ligação com o problema.
  item: '4'
- code: '5'
  title: Critérios de elegibilidade
  applies: OOO
  method: L
  sec:
  - methods
  kw:
  - inclusion criteria
  - exclusion criteria
  - inclusion
  - exclusion
  - language
  - publication year
  - period
  - peer-reviewed
  - grey literature
  q: Os critérios de inclusão e exclusão estão descritos e as restrições da busca (período, idioma, tipo de publicação) estão justificadas?
  full: Critérios de inclusão e exclusão claros, e restrições de busca com justificativa.
  partial: Critérios listados, mas sem justificar as restrições de busca (ou só inclusão, ou só exclusão).
  item: '5'
- code: '6'
  title: Fontes de informação e data da busca
  applies: OOO
  method: RL
  rule: search_sources
  sec:
  - methods
  kw:
  - Scopus
  - IEEE Xplore
  - ACM Digital Library
  - Web of Science
  - ScienceDirect
  - Google Scholar
  - databases
  - search was conducted
  - last search
  q: Os autores listam todas as fontes de busca (bases, registros, pesquisadores contatados) e a data da última busca em cada uma?
  full: Lista as fontes e informa a data (ou mês/ano) da última busca de cada uma.
  partial: Lista as fontes, mas não informa as datas, ou informa só para algumas.
  item: '6'
- code: '7'
  title: Estratégia de busca completa
  applies: OOO
  method: RL
  rule: search_strings
  sec:
  - methods
  kw:
  - search string
  - search query
  - AND
  - OR
  - keywords
  - snowballing
  - manual search
  - pilot search
  - gold standard
  q: A estratégia de busca completa está apresentada (strings de busca de cada base, snowballing, busca manual) de forma que possa ser repetida?
  full: Strings completas (ou em apêndice referenciado) e demais métodos de busca descritos.
  partial: Descreve termos ou a estratégia em linhas gerais, sem a string completa.
  item: '7'
- code: '8'
  title: Processo de seleção
  applies: OOO
  method: L
  sec:
  - methods
  kw:
  - reviewers
  - authors independently
  - screening
  - selection
  - disagreement
  - kappa
  - agreement
  - consensus
  - pilot
  - tool
  q: O processo de seleção informa quantos revisores avaliaram cada estudo, se foram independentes, como resolveram discordâncias e a concordância
    medida?
  full: Informa número de revisores, independência e tratamento de discordâncias (idealmente com concordância medida).
  partial: Informa parte disso (por exemplo, só que dois autores selecionaram), sem independência ou discordâncias.
  item: '8'
- code: '9'
  title: Processo de coleta de dados
  applies: OOO
  method: L
  sec:
  - methods
  kw:
  - data extraction
  - extracted
  - extraction form
  - independently
  - cross-check
  - validated
  - contacted authors
  q: A coleta de dados informa quantos revisores extraíram dados de cada estudo, se foram independentes e como os dados foram conferidos ou confirmados?
  full: Informa número de revisores, independência e conferência dos dados.
  partial: Informa que houve extração (e talvez formulário), sem número de revisores nem conferência.
  item: '9'
- code: 10a
  title: Desfechos (outcomes) buscados
  applies: O-O
